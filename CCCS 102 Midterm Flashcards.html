B. Input-Processing-Output (IPO)
C. Ahead-Of-Time (AOT) Compilation

B. Input-Processing-Output (IPO)

##
Dutch computer scientist Guido van Rossum created Python in 1991 and named it after which of the following?
A. The non-venomous constrictor snake family Pythonidae
B. The British comedy television show Monty Python's Flying Circus
C. The Python programming paradigm introduced in C++
D. An acronym for "Systematic Pythonic Object Notation"
@@
B. The British comedy television show Monty Python's Flying Circus
Explanation: Guido van Rossum named Python after the BBC comedy series Monty Python's Flying Circus while looking for a short, unique, and slightly irreverent name.
##
Which property of an algorithm, according to Donald Knuth, guarantees that every single instruction must be clear, unambiguous, and leave zero room for interpretation?
A. Finiteness
B. Definiteness
C. Effectiveness
D. Feasibility
@@
B. Definiteness
Explanation: According to Donald Knuth's 5 criteria, Definiteness dictates that every operation must be clear, unambiguous, and strictly defined.
##
What translation execution model does standard Python (CPython) utilize?
A. Pure Ahead-Of-Time (AOT) Compilation directly to host CPU assembly
B. Pure Line-by-Line Source Text Interpretation without intermediate compilation
C. A Hybrid Model that compiles source code into Bytecode (.pyc) before running on a Virtual Machine (PVM)
D. Direct Hardware Execution via CPU Microcode registers
@@
C. A Hybrid Model that compiles source code into Bytecode (.pyc) before running on a Virtual Machine (PVM)
Explanation: CPython first compiles human-readable .py source text into platform-neutral Bytecode (.pyc), which is then executed line-by-line by the Python Virtual Machine (PVM).
##

A. Parallelogram

What system configuration is required for a command-line terminal to recognize the python command from any current working directory?

##

##
Consider the Python statement: x = 10. What happens in memory when you execute a subsequent line: x = "Hello"?
A. The integer object 10 is converted into a string in-place without changing its memory address.
B. A TypeError is raised because Python does not allow changing variable types.
C. The symbolic name tag x is rebound to a newly created string heap object "Hello".
D. The compiler reserves 10 bytes of memory in the global call stack.
@@
C. The symbolic name tag x is rebound to a newly created string heap object "Hello".
Explanation: In Python's dynamic typing model, variables are name tags pointing to heap objects. Reassigning a variable rebinds the tag to a new memory object.
##

B. bool(0.0)

A. 3.4
B. 3
C. 2
D. 3.0

B. 3
Explanation: Floor division (//) performs integer division and truncates/rounds down to the nearest lower integer (17 // 5 = 3).

A. -3

C. -4
D. -4.0

C. -4

##
What happens when an if-elif-else ladder evaluates a value, and multiple elif conditions evaluate to True?
A. All matching branches are executed sequentially.
B. Only the last matching branch is executed.

C. Only the first matching branch is executed; all subsequent branches are skipped.

##

##

##
What is the behavior of the else clause attached to a for or while loop?
A. It executes continuously alongside every iteration of the loop body.
B. It executes only if the loop is terminated prematurely by a break statement.
C. It executes only if the loop completes all iterations naturally without encountering a break.
D. It executes as a fallback when the loop condition raises an exception.

C. It executes only if the loop completes all iterations naturally without encountering a break.
Explanation: A loop's else clause runs if the loop exhausts its iterable or finishes its condition naturally, but is bypassed if a break statement exits the loop.

##
Why should you avoid using a mutable default argument like def my_func(items=[])?

##

const $=id=>document.getElementById(id);
let deck,i,st;

  const c=deck[i],card=$("card");
  card.classList.add("nt");card.classList.remove("flip");void card.offsetWidth;card.classList.remove("nt");
  $("q").textContent=c.q;$("a").textContent=c.a;

  const s=st[c.id];$("mark").textContent=s==="k"?"✓ Known":s==="r"?"✕ Review":"";
  const k=Object.values(st).filter(v=>v==="k").length,r=Object.values(st).filter(v=>v==="r").length;
  $("sk").textContent="✓ Know: "+k;$("sr").textContent="✕ Review: "+r;$("su").textContent="Unmarked: "+(deck.length-k-r);
}
const flip=()=>$("card").classList.toggle("flip");
const go=d=>{i=Math.min(deck.length-1,Math.max(0,i+d));show()};
const mark=v=>{st[deck[i].id]=v;i<deck.length-1?go(1):show()};
$("card").onclick=flip;
$("card").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
document.onkeydown=e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("know").onclick=()=>mark("k");$("rev").onclick=()=>mark("r");
$("shuf").onclick=()=>{for(let n=deck.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[deck[n],deck[j]]=[deck[j],deck[n]]}i=0;show()};
$("reset").onclick=init;
init();
</script></body></html>
